services:
  - type: web
    name: code-analyzer-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install && npm run build --workspace=packages/shared && npm run build --workspace=apps/api
    startCommand: npm run start --workspace=apps/api
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 3001
      - key: MAX_UPLOAD_BYTES
        value: "52428800"
      - key: MAX_UPLOAD_FILES
        value: "2000"
      - key: HIGH_SIGNAL_TOKEN_BUDGET
        value: "60000"
      - key: DB_PATH
        value: /data/code-analyzer.sqlite
      - key: LLM_MOCK
        value: "0"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5-20250929
    disk:
      name: code-analyzer-data
      mountPath: /data
      sizeGB: 1
    healthCheckPath: /api/health
